services:
  - type: web
    name: pricekart-backend
    env: java
    plan: free
    buildCommand: "cd backend && mvn clean package -DskipTests"
    startCommand: "java -jar backend/target/*.jar"
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
